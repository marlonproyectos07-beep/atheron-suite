# ATH-HOTELS-SIRE-TRA-001 · Emisor TRA (API PMS MinCIT). APAGADO por defecto.
# Corre solo si la variable del repositorio TRA_EMITTER_ENABLED == 'yes'.
# - Manual (workflow_dispatch): EXIGE "order_id" (id del pedido) tanto en simulacion como con "send"; solo procesa ese
#   pedido. Vacio, mal escrito o fuera de rango: error sin tocar Odoo ni el MinCIT. Sin "send" hace la comprobacion
#   completa (todos los campos y bloqueos, solo lectura; error si no hay TRA pendiente o si algun dato bloquea).
#   Con "send" repite la comprobacion y no envia nada si algo bloquea.
# - Programado (cada hora, preparado 2026-11-18): autorizacion independiente; envia SOLO si ademas TRA_AUTO_SEND == 'yes'
#   (el script lo vuelve a comprobar); si no, solo lista ids. No admite pedido.
# En ambos casos el emisor exige TRA_ENABLED=yes-real, TRA_TOKEN, catalogo verificado y establecimiento en modo API con
# configuracion verificada, y solo reporta estancias con TODOS sus huespedes VALIDADOS, con LLEGADA y SALIDA REALES
# (MinCIT 2-2026-039958: envio al check-out; check_out = salida real). Antes del check-out: cero envios.
# Cada linea se reclama antes de enviar (sin duplicados), un resultado incierto no se reenvia a ciegas y el recorrido se
# detiene en la primera peticion fallida.
# Los registros publicos del repositorio solo muestran ids y codigos: nunca datos de huespedes.
name: TRA emisor (apagado por variables)
on:
  workflow_dispatch:
    inputs:
      send:
        description: 'Enviar de verdad (exige TRA_ENABLED=yes-real, token y catalogo verificado)'
        type: boolean
        default: false
      order_id:
        description: 'Id del pedido (sale.order). Obligatorio: la ejecucion manual procesa solo ese pedido'
        required: true
        type: string
        default: ''
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: read
concurrency:
  group: tra-emitter
  cancel-in-progress: false
jobs:
  emitir:
    if: vars.TRA_EMITTER_ENABLED == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/smoobu-odoo-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Emisor
        env:
          ODOO_BASE_URL: ${{ vars.ODOO_BASE_URL }}
          ODOO_DATABASE: ${{ vars.ODOO_DATABASE }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          TRA_ENABLED: ${{ vars.TRA_ENABLED }}
          TRA_TOKEN: ${{ secrets.TRA_TOKEN }}
          TRA_TRIGGER: ${{ github.event_name }}
          TRA_AUTO_SEND: ${{ vars.TRA_AUTO_SEND }}
          TRA_ONLY_ORDER: ${{ github.event_name == 'workflow_dispatch' && inputs.order_id || '' }}
          SEND: ${{ (github.event_name == 'workflow_dispatch' && inputs.send) || (github.event_name == 'schedule' && vars.TRA_AUTO_SEND == 'yes') }}
        run: |
          if [ "$SEND" = "true" ]; then node scripts/tra-emit.mjs --send; else node scripts/tra-emit.mjs; fi
