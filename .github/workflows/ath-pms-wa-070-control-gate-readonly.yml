name: ATH-PMS-WA-070 CP04 — Read-only ControlGate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-gate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: integrations/smoobu-odoo-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real Odoo ControlGate (read-only)
        env:
          ODOO_BASE_URL: ${{ secrets.ODOO_BASE_URL }}
          ODOO_DATABASE: ${{ secrets.ODOO_DATABASE }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: node scripts/control-gate-readonly.mjs
