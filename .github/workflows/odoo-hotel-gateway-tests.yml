name: Odoo Hotel Gateway — tests internos

on:
  push:
    branches:
      - feature/ath-odoo-hotel-008a-live
      - feature/ath-odoo-hotel-007-gateway
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test (sin secretos, sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar suite de tests del gateway (dry-run/test doubles, sin credenciales)
        working-directory: integrations/odoo-hotel-gateway
        run: node --test
