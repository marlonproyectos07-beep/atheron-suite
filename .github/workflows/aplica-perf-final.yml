name: Aplicar optimizacion Lighthouse final

on:
  push:
    branches:
      - claude/habitaciones-202-203

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.head_commit.message == 'APLICAR PERF FINAL: hero e imagenes responsive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios estructurales sin alterar el diseño
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          pagina_path = Path('src/pages/hospedajes/[slug].astro')
          pagina = pagina_path.read_text()

          old = '    <section class="hero hero--interior">\n      <div class="contenedor hero__contenido">'
          new = '''    <section class:list={['hero', 'hero--interior', esHotelAtheron && 'hero--hotel-atheron']}>
      {esHotelAtheron && (
        <picture class="hero-hotel__fondo" aria-hidden="true">
          <source media="(max-width: 700px)" type="image/avif" srcset="/assets/img/hospedajes/la-magia-de-zipaquira-principal-700.avif" />
          <source media="(max-width: 700px)" type="image/webp" srcset="/assets/img/hospedajes/la-magia-de-zipaquira-principal-700.webp" />
          <source type="image/avif" srcset="/assets/img/hospedajes/la-magia-de-zipaquira-principal-900.avif" />
          <source type="image/webp" srcset="/assets/img/hospedajes/la-magia-de-zipaquira-principal-900.webp" />
          <img
            src="/assets/img/hospedajes/la-magia-de-zipaquira-principal.jpg"
            alt=""
            width="900"
            height="675"
            loading="eager"
            fetchpriority="high"
            decoding="async"
          />
        </picture>
      )}
      <div class="contenedor hero__contenido">'''
          assert pagina.count(old) == 1, 'No se encontro apertura del hero'
          pagina = pagina.replace(old, new, 1)

          old = '                  <Foto src={d.fotoPrincipal} alt={d.fotoPrincipalAlt} />'
          new = '''                  <Foto
                    src={d.fotoPrincipal}
                    alt={d.fotoPrincipalAlt}
                    anchos={[400, 600, 700, 900]}
                    medidas="(min-width: 900px) 510px, calc(100vw - 3rem)"
                    ancho={900}
                    alto={675}
                  />'''
          assert pagina.count(old) == 1, 'No se encontro foto Casa completa'
          pagina = pagina.replace(old, new, 1)

          old = '                        <Foto src={h.foto} alt={h.fotoAlt} />'
          new = '''                        <Foto
                          src={h.foto}
                          alt={h.fotoAlt}
                          anchos={[240, 360, 480]}
                          medidas="(min-width: 900px) 220px, calc(100vw - 3rem)"
                          ancho={900}
                          alto={675}
                        />'''
          assert pagina.count(old) == 1, 'No se encontro foto mini de habitacion'
          pagina = pagina.replace(old, new, 1)

          old = '                    <Foto src={h.foto} alt={h.fotoAlt} forma="cuadrado" />'
          new = '''                    <Foto
                      src={h.foto}
                      alt={h.fotoAlt}
                      forma="cuadrado"
                      anchos={[240, 360, 480]}
                      medidas="(min-width: 900px) 190px, 42vw"
                      ancho={900}
                      alto={675}
                    />'''
          assert pagina.count(old) == 1, 'No se encontro mini de Casa completa'
          pagina = pagina.replace(old, new, 1)

          # La foto principal de cada ficha de habitacion usa las mismas
          # variantes pequenas, porque su columna mide ~320 px.
          old = '<Foto src={h.foto} alt={h.fotoAlt}>Foto pendiente</Foto>'
          new = '''<Foto
                        src={h.foto}
                        alt={h.fotoAlt}
                        anchos={[360, 480]}
                        medidas="(min-width: 800px) 320px, calc(100vw - 3rem)"
                        ancho={900}
                        alto={675}
                      >Foto pendiente</Foto>'''
          assert pagina.count(old) == 1, 'No se encontro foto grande de habitacion'
          pagina = pagina.replace(old, new, 1)

          pagina_path.write_text(pagina)

          css_path = Path('public/assets/css/hotel-selector.css')
          css = css_path.read_text()
          inicio = css.index('/* ------------------------------------------------------------\n   HERO FOTOGRAFICO')
          fin = css.index('/* La eleccion de Casa completa')
          hero = '''/* ------------------------------------------------------------
   HERO FOTOGRAFICO — imagen real en el HTML
   La imagen se descubre desde el primer parseo y lleva prioridad alta.
   El diseño visual es el mismo: foto a sangre + degradado.
   ------------------------------------------------------------ */
.hero--hotel-atheron {
  min-height: clamp(540px, 70vh, 720px);
  isolation: isolate;
  background: var(--color-noche);
}
.hero--hotel-atheron .hero-hotel__fondo {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
}
.hero--hotel-atheron .hero-hotel__fondo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 53%;
}
.hero--hotel-atheron::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(90deg, rgba(8, 18, 34, .91) 0%, rgba(8, 18, 34, .76) 42%, rgba(8, 18, 34, .28) 72%, rgba(8, 18, 34, .15) 100%);
  pointer-events: none;
}
.hero--hotel-atheron .hero__contenido {
  position: relative;
  z-index: 2;
  max-width: 760px;
  padding-block: clamp(2.5rem, 6vw, 5rem);
}
.hero--hotel-atheron .hero__titulo {
  text-shadow: 0 2px 22px rgba(0, 0, 0, .28);
}
.hero--hotel-atheron .hero__texto {
  max-width: 52ch;
  color: rgba(255,255,255,.94);
  text-shadow: 0 1px 10px rgba(0, 0, 0, .35);
}
.hero--hotel-atheron .hero__etiqueta {
  background: rgba(8,18,34,.36);
  backdrop-filter: blur(5px);
}
.hero--hotel-atheron .hero__datos {
  max-width: 670px;
  border-top-color: rgba(255,255,255,.34);
}
/* El dorado original de esta etiqueta daba 2.41:1 sobre blanco.
   Esta variante mantiene el tono de marca y supera 4.5:1. */
.hero--hotel-atheron + .seccion .bloque-doble__texto > .etiqueta {
  color: #856a10;
}

'''
          css = css[:inicio] + hero + css[fin:]

          patron = re.compile(r'''  body:has\(\.hotel-selector-seccion\) \.hero--interior \{.*?\n  \}\n  body:has\(\.hotel-selector-seccion\) \.hero--interior \.hero__contenido \{''', re.S)
          reemplazo = '''  .hero--hotel-atheron { min-height: 560px; }
  .hero--hotel-atheron .hero-hotel__fondo img { object-position: 62% center; }
  .hero--hotel-atheron::after {
    background: linear-gradient(180deg, rgba(8,18,34,.74) 0%, rgba(8,18,34,.76) 58%, rgba(8,18,34,.90) 100%);
  }
  .hero--hotel-atheron .hero__contenido {'''
          css, n = patron.subn(reemplazo, css, count=1)
          assert n == 1, 'No se encontro bloque movil viejo del hero'

          marcador = '/* En la vista de Casa completa se conserva UN CTA principal para la\n   reserva del grupo. Las cinco miniaturas sirven para explorar cada\n   habitacion y no compiten con cinco WhatsApps diferentes. */\n\n'
          assert marcador in css, 'No se encontro marcador de Casa completa'
          extra = '''/* Las fichas completas quedan fuera del primer viewport. El navegador
   puede posponer su layout hasta que el visitante entra a una opcion. */
.hotel-detalles .habitacion,
.hotel-casa-detalle {
  content-visibility: auto;
  contain-intrinsic-size: auto 900px;
}

'''
          css = css.replace(marcador, marcador + extra, 1)
          css_path.write_text(css)
          PY

      - name: Instalar y probar build
        run: |
          npm ci
          npm run comprueba
          npm run build

      - name: Guardar optimizacion
        run: |
          git config user.name "Atheron QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/hospedajes/'[slug].astro' public/assets/css/hotel-selector.css
          git commit -m "Rendimiento: hero prioritario y fotos responsive" || exit 0
          git push origin HEAD:claude/habitaciones-202-203
