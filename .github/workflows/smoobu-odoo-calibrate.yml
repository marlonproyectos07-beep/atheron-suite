# ============================================================
# CALIBRACION DE SOLO LECTURA DE planning.slot (ATH-DEV-011)
# Solo manual (workflow_dispatch). NO llama a Smoobu. Solo ejecuta
# fields_get y search_read contra Odoo. Salida anonimizada: ids,
# horas, conteos y la "forma" del texto; nunca nombres ni secretos.
# Usa los mismos secretos/variables que smoobu-odoo-diagnose:
#   secreto ODOO_API_KEY; variables ODOO_BASE_URL, ODOO_DATABASE.
# ============================================================
name: smoobu-odoo-calibrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoobu-odoo-calibrate
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integrations/smoobu-odoo-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas unitarias
        run: npm test
      - name: Calibracion (solo lectura)
        env:
          ODOO_BASE_URL: ${{ vars.ODOO_BASE_URL }}
          ODOO_DATABASE: ${{ vars.ODOO_DATABASE }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: npm run --silent calibrate
