# ============================================================
# SINCRONIZACION PROGRAMADA SMOOBU -> ODOO (ATH-DEV-125)
#
# Crea SOLO contactos y pedidos en BORRADOR para reservas nuevas y validas de Smoobu (referencia unica SMOOBU-<id>).
# Nunca confirma, cancela, modifica pedidos existentes, registra pagos ni factura.
# Interruptores:
#   - vars.SYNC_ENABLED == 'true'  -> si no, el job no corre (ni programado ni manual).
#   - vars.SYNC_KILL == '1'        -> apagado inmediato (se comprueba antes de cada operacion).
#   - Escritura REAL solo si AUTO_ARMED es true en src/sync-auto-client.mjs Y vars.SYNC_ARM trae la frase; hoy
#     AUTO_ARMED=false: corre EN SOMBRA (lecturas reales, 0 escrituras). Los interruptores globales de escritura no se
#     tocan (el conciliador diario exige que sigan en false).
# Lote: 1 reserva por ejecucion (tope fijo de fase) y como mucho 3 por dia de Bogota (cupo PERSISTENTE leido de Odoo).
# Alertas: anotaciones + fallo del job (GitHub notifica).
# ATH-DEV-130 BLOQUEO PERSISTENTE DE ESCRITURA (sustituye al deshabilitado del workflow de ATH-DEV-129): si `sync` no
#   termina bien (error, duplicado, cambio inesperado, escritura parcial, pruebas fallidas, tiempo agotado o cancelacion),
#   el job `apagado` abre una incidencia `BLOQUEO-ESCRITURA-SYNC`. Desde ese momento la sincronizacion corre SIEMPRE EN
#   SOMBRA (vigila, avisa y muestra el tablero, sin crear pedidos) hasta que gerencia revise y fije la variable
#   SYNC_DESBLOQUEO = DESBLOQUEO-<numero de la incidencia>. Reiniciar, relanzar, cerrar la incidencia o cambiar otras
#   variables NO desbloquea. El workflow y el conciliador diario siguen activos.
# ============================================================
name: smoobu-odoo-sync-scheduled

on:
  schedule:
    # cada 2 horas, minuto 23 (UTC)
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      prueba_bloqueo:
        # ATH-DEV-132: prueba controlada del bloqueo persistente. La sincronizacion corre normal (en sombra); despues el job
        # `apagado` abre una incidencia BLOQUEO-ESCRITURA-SYNC REAL sin provocar ningun fallo. Solo puede AÑADIR un bloqueo,
        # nunca quitarlo; quitarlo sigue exigiendo SYNC_DESBLOQUEO de gerencia. Las ejecuciones programadas no la usan.
        description: 'Prueba controlada: abrir un bloqueo de escritura real tras una sincronizacion correcta'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smoobu-odoo-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: leer el repo; issues: leer el pestillo de bloqueo (ATH-DEV-130). Ningun permiso de escritura.
    permissions:
      contents: read
      issues: read
    # ATH-DEV-028: secretos de Smoobu guardados intercambiados; mismo cruce que diagnose (vigilado por test)
    env:
      SMOOBU_API_KEY: ${{ secrets.SMOOBU_API_SECRET }}
      SMOOBU_API_SECRET: ${{ secrets.SMOOBU_API_KEY }}
    defaults:
      run:
        working-directory: integrations/smoobu-odoo-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas unitarias (si fallan, no se toca nada)
        run: npm test
      - name: Sincronizacion (solo borradores)
        env:
          SMOOBU_BASE_URL: ${{ vars.SMOOBU_BASE_URL }}
          ODOO_BASE_URL: ${{ vars.ODOO_BASE_URL }}
          ODOO_DATABASE: ${{ vars.ODOO_DATABASE }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
          SYNC_KILL: ${{ vars.SYNC_KILL }}
          SYNC_MAX_OPS: ${{ vars.SYNC_MAX_OPS }}
          SYNC_MAX_AMOUNT: ${{ vars.SYNC_MAX_AMOUNT }}
          SYNC_MAX_NIGHTS: ${{ vars.SYNC_MAX_NIGHTS }}
          SYNC_ARM: ${{ vars.SYNC_ARM }}
          SYNC_DESBLOQUEO: ${{ vars.SYNC_DESBLOQUEO }}
          SYNC_LATCH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SYNC_JOURNAL_PATH: ${{ runner.temp }}/sync-bitacora.jsonl
          SYNC_LOCK_PATH: ${{ runner.temp }}/sync.lock
        run: |
          if [ -n "$SYNC_ARM" ]; then echo "::add-mask::$SYNC_ARM"; fi
          npm run --silent sync-auto
      - name: Guardar la bitacora (sin datos personales)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-bitacora-${{ github.run_number }}
          path: ${{ runner.temp }}/sync-bitacora.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # ATH-DEV-130: unico job con un permiso de escritura, y solo sobre incidencias (abrir el pestillo de bloqueo). No lee
  # secretos, no hace checkout, no toca Odoo ni Smoobu y NO deshabilita el workflow (la vigilancia en sombra sigue).
  apagado:
    needs: sync
    if: ${{ always() && vars.SYNC_ENABLED == 'true' && ((needs.sync.result != 'success' && needs.sync.result != 'skipped') || (github.event_name == 'workflow_dispatch' && inputs.prueba_bloqueo == true && needs.sync.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Bloqueo persistente de escritura (abre BLOQUEO-ESCRITURA-SYNC si no hay uno pendiente)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTADO: ${{ needs.sync.result }}
          RUN_ID: ${{ github.run_id }}
          SYNC_DESBLOQUEO: ${{ vars.SYNC_DESBLOQUEO }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba_bloqueo == true && needs.sync.result == 'success' }}
        run: |
          if [ "$PRUEBA" = "true" ]; then MOTIVO="PRUEBA CONTROLADA (sin fallo real; sincronizacion correcta)"; else MOTIVO="FALLO (resultado: $RESULTADO)"; fi
          ACK=$(printf '%s' "$SYNC_DESBLOQUEO" | sed -n 's/^DESBLOQUEO-\([0-9]\{1,9\}\)$/\1/p'); ACK=${ACK:-0}
          # si no se puede leer, se abre uno nuevo (falla cerrado)
          MAX=$(gh api "repos/$GH_REPO/issues?state=all&creator=github-actions%5Bbot%5D&per_page=100" --jq '[.[] | select(.pull_request == null and (.title | startswith("BLOQUEO-ESCRITURA-SYNC"))) | .number] | max // 0') || MAX=-1
          if [ "$MAX" -gt "$ACK" ]; then
            echo "Ya hay un bloqueo pendiente (#$MAX > reconocido $ACK): la escritura sigue bloqueada."
          else
            gh api -X POST "repos/$GH_REPO/issues" -f title="BLOQUEO-ESCRITURA-SYNC ejecucion $RUN_ID" -f body="Motivo: $MOTIVO. Sincronizacion programada Smoobu -> Odoo, ejecucion $RUN_ID. Desde ahora corre SOLO EN SOMBRA: no puede crear pedidos. Para desbloquear, gerencia revisa el fallo y fija la variable de Actions SYNC_DESBLOQUEO = DESBLOQUEO-<numero de esta incidencia>. Cerrar esta incidencia no desbloquea." --jq '"Bloqueo abierto: #" + (.number|tostring)'
          fi
          echo "::error::Escritura de la sincronizacion BLOQUEADA. Motivo: $MOTIVO. La vigilancia en sombra sigue activa."
          echo "### Escritura BLOQUEADA. Motivo: $MOTIVO. Sigue en sombra hasta SYNC_DESBLOQUEO de gerencia." >> "$GITHUB_STEP_SUMMARY"
